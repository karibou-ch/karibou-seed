<div class="adm-shell">

  <!-- ── SIDEBAR ─────────────────────────────────────────────────────────────── -->
  <aside class="adm-sidebar" [class.open]="sidebarOpen">

    <!-- Brand + locale switch -->
    <div class="adm-sidebar-top">
      <div class="adm-brand">
        <span class="adm-brand-name">karibou admin</span>
        <div class="adm-lang-switch">
          <button class="adm-lang-btn" [class.active]="locale === 'fr'" (click)="onLocaleChange('fr')">FR</button>
          <button class="adm-lang-btn" [class.active]="locale === 'en'" (click)="onLocaleChange('en')">EN</button>
        </div>
      </div>
    </div>

    <!-- Nav -->
    <nav class="adm-nav">

      <div class="adm-nav-label">Général</div>
      <a routerLink="./config" routerLinkActive="active" class="adm-nav-item">
        <span class="adm-nav-dot"></span>Configuration
      </a>
      <a routerLink="./welcome" routerLinkActive="active" class="adm-nav-item">
        <span class="adm-nav-dot"></span>Welcome
      </a>
      <a routerLink="./navigation" routerLinkActive="active" class="adm-nav-item">
        <span class="adm-nav-dot"></span>Navigation
      </a>
      <a routerLink="./page" routerLinkActive="active" class="adm-nav-item">
        <span class="adm-nav-dot"></span>Pages
      </a>
      <a routerLink="./category" routerLinkActive="active" class="adm-nav-item">
        <span class="adm-nav-dot"></span>Catégories
      </a>
      <a routerLink="./shop" routerLinkActive="active" class="adm-nav-item">
        <span class="adm-nav-dot"></span>Boutiques
      </a>

      <div class="adm-nav-label">Hub</div>

      <!-- Sélecteur de hub (déplacé ici) -->
      <div class="adm-hub-wrapper">
        <div class="adm-hub-btn" (click)="toggleHubMenu()">
          <span>Hub : <strong>{{store}}</strong></span>
          <span class="adm-hub-caret" [class.open]="hubMenuOpen">▼</span>
        </div>
        <div class="adm-hub-dropdown" *ngIf="hubMenuOpen">
          <div *ngFor="let hub of hubs"
               class="adm-hub-option"
               [class.active]="hub.slug === store"
               (click)="onHubChange(hub.slug)">
            {{hub.name || hub.slug}}
          </div>
        </div>
      </div>

      <a routerLink="./main-hub" routerLinkActive="active" class="adm-nav-item">
        <span class="adm-nav-dot"></span>Paramètres
      </a>
      <a routerLink="./manager-hub" routerLinkActive="active" class="adm-nav-item">
        <span class="adm-nav-dot"></span>Manager
      </a>
      <a routerLink="./information" routerLinkActive="active" class="adm-nav-item">
        <span class="adm-nav-dot"></span>Information
      </a>
      <a routerLink="./deposit" routerLinkActive="active" class="adm-nav-item">
        <span class="adm-nav-dot"></span>Dépôts
      </a>

    </nav>

    <!-- User footer -->
    <div class="adm-sidebar-footer">
      <div class="adm-user-avatar">A</div>
      <div class="adm-user-info">
        <div class="adm-user-name">{{store}}</div>
        <div class="adm-user-role">Administrateur</div>
      </div>
    </div>

  </aside>

  <!-- ── OVERLAY mobile ────────────────────────────────────────────────────── -->
  <div class="adm-overlay" [class.visible]="sidebarOpen" (click)="closeSidebar()"></div>

  <!-- ── MAIN ──────────────────────────────────────────────────────────────── -->
  <main class="adm-main">
    <button class="adm-hamburger" (click)="toggleSidebar()" aria-label="Menu">
      <span class="material-symbols-outlined">menu</span>
    </button>

    <div class="adm-content-area">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
