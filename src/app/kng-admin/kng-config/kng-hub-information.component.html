<div class="page-saving" [hidden]="isReady">
  <h1>Enregistrement…</h1>
</div>

<div class="adm-page" *ngIf="currentHub">

  <h1 class="adm-page-title">Hub — Information</h1>
  <hr class="adm-page-divider">

  <!-- ── MESSAGES ──────────────────────────────────────────────────────────── -->
  <div *ngIf="saveMessage || saveError" style="margin-bottom:var(--adm-space-4)">
    <wa-callout *ngIf="saveMessage" variant="success" closable (wa-hide)="saveMessage=''">{{saveMessage}}</wa-callout>
    <wa-callout *ngIf="saveError" variant="danger" closable (wa-hide)="saveError=''">{{saveError}}</wa-callout>
  </div>

  <!-- ── MAINTENANCE ───────────────────────────────────────────────────────── -->
  <div class="adm-card">
    <div class="adm-card-title">Maintenance</div>

    <kng-config-input clazz="config" label="Message maintenance" name="header.maintenance" format="area" [withCheck]="true"
                      [(ngModel)]="currentHub.maintenance.reason[$i18n.locale]"
                      [checked]="currentHub.maintenance.active"
                      (checkChange)="currentHub.maintenance.active=$event"></kng-config-input>

    <div class="adm-action-row">
      <wa-button appearance="filled" size="small" (click)="onHubSave()">
        <span class="material-symbols-outlined" slot="prefix">save</span>
        Sauvegarder
      </wa-button>
    </div>
  </div>

  <!-- ── SECTIONS PAGE D'ACCUEIL ────────────────────────────────────────────── -->
  <div class="adm-card">
    <div class="adm-card-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>Sections page d'accueil</span>
      <wa-button appearance="outlined" size="small" (click)="addContent()">
        <span class="material-symbols-outlined" slot="prefix">add</span>
        Section
      </wa-button>
    </div>

    <div class="hub-content" *ngFor="let content of currentHub.home.content; let $idx=index">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--adm-space-3)">
        <span style="font-size:var(--adm-font-size-s);font-weight:500;color:var(--adm-text-secondary)">Section {{$idx + 1}}</span>
        <wa-button appearance="text" size="small" (click)="currentHub.home.content.splice($idx, 1)">
          <span class="material-symbols-outlined">delete</span>
        </wa-button>
      </div>

      <kng-config-input clazz="config" label="Cible" name="content-{{$idx}}.target" format="text"
                        [(ngModel)]="content.target"></kng-config-input>

      <kng-config-input clazz="config" label="Titre" name="content-{{$idx}}.titre" format="text"
                        [(ngModel)]="content.t[$i18n.locale]"></kng-config-input>

      <kng-config-input clazz="config" label="Header" name="content-{{$idx}}.h" format="text"
                        [(ngModel)]="content.h[$i18n.locale]"></kng-config-input>

      <kng-config-input clazz="config run-codemirror" label="Paragraphe" name="content-{{$idx}}.p" format="area"
                        [(ngModel)]="content.p[$i18n.locale]"></kng-config-input>

      <kng-config-input clazz="config" label="Image" name="content-{{$idx}}.image" format="image"
                        (imageChange)="onDialogOpen($event)" [config]="config"
                        [(ngModel)]="content.image"></kng-config-input>
    </div>

    <div class="adm-action-row">
      <wa-button appearance="filled" size="small" (click)="onHubSave()">
        <span class="material-symbols-outlined" slot="prefix">save</span>
        Sauvegarder
      </wa-button>
    </div>
  </div>

  <!-- ── HEADER HOME ───────────────────────────────────────────────────────── -->
  <div class="adm-card">
    <div class="adm-card-title">Header <span class="gray">(home middle)</span></div>

    <kng-config-input clazz="config run-codemirror" label="Message header" name="header.message" format="area" [withCheck]="true"
                      [(ngModel)]="currentHub.header.message[$i18n.locale]"
                      [checked]="currentHub.header.active"
                      (checkChange)="currentHub.header.active=$event"></kng-config-input>

    <div class="adm-action-row">
      <wa-button appearance="filled" size="small" (click)="onHubSave()">
        <span class="material-symbols-outlined" slot="prefix">save</span>
        Sauvegarder
      </wa-button>
    </div>
  </div>

  <!-- ── SELECTION ─────────────────────────────────────────────────────────── -->
  <div class="adm-card">
    <div class="adm-card-title">Sélection</div>

    <kng-config-input clazz="config" label="Titre sélection" name="home.selection.t" format="text"
                      [(ngModel)]="currentHub.home.selection.t[$i18n.locale]"></kng-config-input>

    <div class="adm-action-row">
      <wa-button appearance="filled" size="small" (click)="onHubSave()">
        <span class="material-symbols-outlined" slot="prefix">save</span>
        Sauvegarder
      </wa-button>
    </div>
  </div>

  <!-- ── CHECKOUT ──────────────────────────────────────────────────────────── -->
  <div class="adm-card">
    <div class="adm-card-title">Checkout</div>

    <kng-config-input clazz="config" label="Titre" name="checkout.titre" format="area"
                      [(ngModel)]="currentHub.checkout.title[$i18n.locale]"></kng-config-input>

    <kng-config-input clazz="config" label="Adresse" name="checkout.address" format="area"
                      [(ngModel)]="currentHub.checkout.address[$i18n.locale]"></kng-config-input>

    <kng-config-input clazz="config" label="Paiement" name="checkout.payment" format="area"
                      [(ngModel)]="currentHub.checkout.payment[$i18n.locale]"></kng-config-input>

    <kng-config-input clazz="config" label="Résumé" name="checkout.resume" format="area"
                      [(ngModel)]="currentHub.checkout.resume[$i18n.locale]"></kng-config-input>

    <kng-config-input clazz="config" label="Message" name="checkout.message" format="area"
                      [(ngModel)]="currentHub.checkout.message[$i18n.locale]"
                      [checked]="currentHub.checkout.active" [withCheck]="true"
                      (checkChange)="currentHub.checkout.active=$event"></kng-config-input>

    <div class="adm-action-row">
      <wa-button appearance="filled" size="small" (click)="onHubSave()">
        <span class="material-symbols-outlined" slot="prefix">save</span>
        Sauvegarder
      </wa-button>
    </div>
  </div>

</div>
