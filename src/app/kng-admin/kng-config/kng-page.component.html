<div class="kng-admin-page">
  <header class="kng-page-head">
    <div class="kng-page-head__row">
      <div>
        <p class="kng-page-head__crumb">{{ labels.crumb_admin }} · {{ labels.nav_content }}</p>
        <h1>{{ labels.pages_title }}</h1>
      </div>
      <wa-button appearance="outlined" variant="neutral" size="small" [routerLink]="['./create']">
        <span class="material-symbols-outlined" slot="start" aria-hidden="true">add</span>
        {{ labels.new_page }}
      </wa-button>
    </div>
  </header>

  <router-outlet></router-outlet>

  <section class="kng-settings-group">
    <div class="kng-settings-group__box">
      <a class="kng-list-item" [routerLink]="['./create']">
        <span class="material-symbols-outlined kng-icon is-brand" aria-hidden="true">add_circle</span>
        <span class="kng-list-item__body">
          <span class="kng-list-item__title">{{ labels.add_page }}</span>
          <span class="kng-list-item__sub">{{ labels.add_page_desc }}</span>
        </span>
      </a>
      <a class="kng-list-item" *ngFor="let content of contents" [routerLink]="['./list', content.slug[0]]"
         [class.is-off]="!content.available" [attr.aria-label]="labels.open_page">
        <span class="material-symbols-outlined kng-icon" aria-hidden="true">folder</span>
        <span class="kng-list-item__body">
          <span class="kng-list-item__title">{{ $any(content).type || 'page' }} / {{ content.slug[0] }}</span>
          <span class="kng-list-item__sub" [innerHtml]="content.title[locale]"></span>
        </span>
        <span class="kng-list-item__meta" *ngIf="$any(content).weight">{{ $any(content).weight }}</span>
        <span class="kng-status-dot" [class.is-on]="content.available"></span>
      </a>
    </div>
  </section>
</div>
