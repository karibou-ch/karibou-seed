<div [ngClass]="clazz + ' input-row-'+format" [ngSwitch]="format">

  <!-- CHECKBOX : full-width, label intégré -->
  <ng-container *ngSwitchCase="'checkbox'">
    <wa-checkbox size="small" [checked]="value" (change)="value = $any($event.target).checked">
      {{label}}
    </wa-checkbox>
  </ng-container>

  <!-- TEXT : grid 160px | input -->
  <ng-container *ngSwitchCase="'text'">
    <label class="adm-field-label">{{label}}</label>
    <div class="adm-field-right">
      <wa-input size="small"
                [value]="value"
                (input)="value = $any($event.target).value"
                [disabled]="disabled">
      </wa-input>
      <wa-checkbox *ngIf="withCheck" size="small" [checked]="checked"
                   (change)="onCheck($any($event.target).checked)"></wa-checkbox>
    </div>
  </ng-container>

  <!-- AREA : grid 160px | textarea -->
  <ng-container *ngSwitchCase="'area'">
    <label class="adm-field-label">{{label}}</label>
    <div class="adm-field-right">
      <wa-textarea size="small"
                   [value]="value"
                   (input)="value = $any($event.target).value"
                   resize="auto"
                   rows="3"
                   [disabled]="disabled">
      </wa-textarea>
      <wa-checkbox *ngIf="withCheck" size="small" [checked]="checked"
                   (change)="onCheck($any($event.target).checked)"></wa-checkbox>
    </div>
  </ng-container>

  <!-- IMAGE : grid 160px | upload widget -->
  <ng-container *ngSwitchCase="'image'">
    <label class="adm-field-label">{{label}}</label>
    <div class="image-field">
      <div class="image-container">
        <div class="image-preview" *ngIf="value">
          <img [src]="value">
          <wa-button size="small" appearance="text" (click)="value=null">
            <span class="material-symbols-outlined">delete</span>
          </wa-button>
        </div>
        <ngx-uploadcare-widget
          [imagesOnly]="true"
          [value]="$any(value)"
          [validator]="ucValidator"
          (on-upload-complete)="onUpload($event)"
          (on-dialog-open)="onDialogOpen($event)"
          [public-key]="config?.shared?.keys?.pubUpcare">
        </ngx-uploadcare-widget>
      </div>
    </div>
  </ng-container>

  <!-- GEO : grid 160px | carte statique -->
  <ng-container *ngSwitchCase="'geo'">
    <label class="adm-field-label">{{label}}</label>
    <div class="geo-field">
      <div class="geo-preview">
        <img [src]="getStaticMap()">
      </div>
    </div>
  </ng-container>

  <!-- LANG -->
  <ng-container *ngSwitchCase="'lang'">
    <div class="lang-selector">
      <span class="lang-label">i18n</span>
      <div class="lang-buttons">
        <wa-button size="small" [appearance]="i18n.locale=='en' ? 'filled' : 'outlined'" (click)="onLang($event,'en')">EN</wa-button>
        <wa-button size="small" [appearance]="i18n.locale=='fr' ? 'filled' : 'outlined'" (click)="onLang($event,'fr')">FR</wa-button>
      </div>
    </div>
  </ng-container>

  <!-- MENU / HUB (dépréciés) -->
  <ng-container *ngSwitchCase="'menu'">
    <wa-callout variant="primary" size="small">Navigation disponible dans le menu latéral</wa-callout>
  </ng-container>

  <ng-container *ngSwitchCase="'hub'">
    <wa-callout variant="primary" size="small">Sélection du Hub disponible dans le menu latéral</wa-callout>
  </ng-container>

</div>
