<div class="kng-setting-row" [class.kng-translatable]="translatable" [class.is-missing]="translatable && missing">
  <div class="kng-setting-row__copy">
    <div class="kng-setting-row__label">
      {{ label }}
      <span class="kng-lang-badge" *ngIf="translatable">{{ locale }}</span>
    </div>
    <p class="kng-setting-row__desc" *ngIf="description">{{ description }}</p>
  </div>

  <div class="kng-setting-row__control">
  <div [ngSwitch]="format">
    <wa-switch *ngSwitchCase="'checkbox'" size="small" [checked]="!!value" [attr.aria-label]="label"
               (change)="value = $any($event.target).checked"></wa-switch>

    <ng-container *ngSwitchCase="'text'">
      <div class="kng-inline-field">
        <wa-input size="small" [label]="label" [value]="displayValue" [disabled]="disabled"
                  (input)="onUserInput($any($event.target).value)"></wa-input>
        <wa-switch *ngIf="withCheck" size="small" [checked]="checked" [attr.aria-label]="label"
                   (change)="onCheck($any($event.target).checked)"></wa-switch>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'area'">
      <wa-textarea size="small" [label]="label" [value]="displayValue" resize="auto" rows="3" [disabled]="disabled"
                   (input)="onUserInput($any($event.target).value)"></wa-textarea>
      <wa-switch *ngIf="withCheck" size="small" [checked]="checked" [attr.aria-label]="label"
                 (change)="onCheck($any($event.target).checked)"></wa-switch>
    </ng-container>

    <ng-container *ngSwitchCase="'color'">
      <wa-input size="small" [label]="label" [value]="displayValue" (input)="onUserInput($any($event.target).value)">
        <span slot="start" class="kng-swatch" [style.--swatch]="displayValue || 'transparent'" aria-hidden="true"></span>
      </wa-input>
    </ng-container>

    <div class="kng-inline-field" *ngSwitchCase="'image'">
      <img *ngIf="value" class="kng-thumb kng-thumb--lg" [src]="value" alt="">
      <wa-button *ngIf="value" appearance="plain" variant="danger" size="small" [label]="labels.delete_image" (click)="value = null">
        <span class="material-symbols-outlined" slot="start" aria-hidden="true">delete</span>
      </wa-button>
      <ngx-uploadcare-widget
        [imagesOnly]="true"
        [value]="$any(value)"
        [validator]="ucValidator"
        (on-upload-complete)="onUpload($event)"
        (on-dialog-open)="onDialogOpen($event)"
        [public-key]="config?.shared?.keys?.pubUpcare">
      </ngx-uploadcare-widget>
    </div>

    <img *ngSwitchCase="'geo'" class="kng-deposit-map" [src]="getStaticMap()" alt="">

    <kng-lang-toggle *ngSwitchCase="'lang'"></kng-lang-toggle>

    <wa-callout *ngSwitchCase="'menu'" variant="brand" size="small">{{ labels.nav_available }}</wa-callout>
    <wa-callout *ngSwitchCase="'hub'" variant="brand" size="small">{{ labels.hub_available }}</wa-callout>
  </div>

    <ng-container *ngIf="translatable && missing">
      <p class="kng-source-hint">{{ labels.source_hint }} {{ i18nField?.fr }}</p>
      <wa-button appearance="plain" variant="brand" size="small" (click)="copyFromFr()">{{ labels.copy_from_fr }}</wa-button>
    </ng-container>
  </div>
</div>
