<div class="kng-page-saving" [hidden]="isReady"><p>{{ labels.saving }}</p></div>

<div class="kng-admin-page" *ngIf="currentHub">
  <header class="kng-page-head">
    <div class="kng-page-head__row">
      <div>
        <p class="kng-page-head__crumb">{{ labels.crumb_admin }} · {{ labels.nav_hub }} · {{ currentHub.name }}</p>
        <h1>{{ labels.deposits_title }}</h1>
        <p class="kng-page-head__desc">{{ labels.deposits_desc }}</p>
      </div>
      <wa-button appearance="outlined" variant="neutral" size="small" (click)="onAddressCreate()">
        <span class="material-symbols-outlined" slot="start" aria-hidden="true">add</span>
        {{ labels.new_deposit }}
      </wa-button>
    </div>
  </header>

  <div class="kng-callouts" *ngIf="saveMessage || saveError">
    <wa-callout *ngIf="saveMessage" variant="success" closable (wa-hide)="saveMessage=''">{{ saveMessage }}</wa-callout>
    <wa-callout *ngIf="saveError" variant="danger" closable (wa-hide)="saveError=''">{{ saveError }}</wa-callout>
  </div>

  <section class="kng-settings-group">
    <div class="kng-settings-group__box">
      <button type="button" class="kng-list-item" (click)="onAddressCreate()">
        <span class="material-symbols-outlined kng-icon is-brand" aria-hidden="true">add_circle</span>
        <span class="kng-list-item__body">
          <span class="kng-list-item__title">{{ labels.add_deposit }}</span>
          <span class="kng-list-item__sub">{{ labels.add_deposit_desc }}</span>
        </span>
      </button>
      <button type="button" class="kng-list-item" *ngFor="let address of currentHub.deposits; let i = index; trackBy: trackDeposit"
              [class.is-off]="!address.active" [attr.aria-label]="labels.open_deposit"
              (click)="onAddressSelect($event, address, i)">
        <span class="kng-deposit-map" [style.--map]="'url(' + getStaticMap(address) + ')'"></span>
        <span class="kng-list-item__body">
          <span class="kng-list-item__title">{{ address.name }}</span>
          <span class="kng-list-item__sub">{{ address.streetAdress }} · {{ address.postalCode }} {{ address.region }}</span>
          <span class="kng-list-item__sub" *ngIf="address.note">{{ address.note }}</span>
        </span>
        <span class="kng-list-item__meta">
          <span class="kng-badge" [class.is-on]="address.active">{{ address.active ? labels.active : labels.inactive }}</span>
          <span>{{ address.fees | currency:'CHF' }}</span>
        </span>
      </button>
    </div>
  </section>
</div>

<kng-deposit-dlg></kng-deposit-dlg>
