<div class="page-saving" [hidden]="isReady">
  <h1>Enregistrement…</h1>
</div>

<div class="adm-page">

  <h1 class="adm-page-title" style="display:flex;align-items:center;justify-content:space-between">
    Navigation
    <wa-button appearance="outlined" size="small" (click)="onMenuCreate()">
      <span class="material-symbols-outlined" slot="prefix">add</span>
      Nouveau menu
    </wa-button>
  </h1>
  <hr class="adm-page-divider">

  <!-- ── MESSAGES ──────────────────────────────────────────────────────────── -->
  <div *ngIf="saveMessage || saveError" style="margin-bottom:var(--adm-space-4)">
    <wa-callout *ngIf="saveMessage" variant="success" closable (wa-hide)="saveMessage=''">{{saveMessage}}</wa-callout>
    <wa-callout *ngIf="saveError" variant="danger" closable (wa-hide)="saveError=''">{{saveError}}</wa-callout>
  </div>

  <!-- ── LISTE PAR GROUPE ─────────────────────────────────────────────────── -->
  <div class="adm-card">

    <ng-container *ngFor="let group of groups">
      <div class="adm-card-title menu-group">{{group}}</div>

      <div class="adm-list" style="margin-bottom: var(--adm-space-4)">
        <div *ngFor="let menu of getMenuByGroup(group); let idx=index; trackBy: trackMenu"
             class="adm-list-item nav-menu-item"
             [class.disabled]="!menu.active"
             (click)="onMenuSelect($event, menu)">

          <span class="adm-status-dot" [class.active]="menu.active" [class.inactive]="!menu.active"></span>
          <span class="nav-menu-weight">{{menu.weight}}</span>
          <span class="nav-menu-name">{{menu.name[$i18n.locale]}}</span>
          <span class="nav-menu-url">{{menu.url}}</span>

          <div class="nav-menu-actions" (click)="$event.stopPropagation()">
            <wa-button appearance="text" size="small" (click)="onMenuSelect($event, menu)">
              <span class="material-symbols-outlined">edit</span>
            </wa-button>
            <wa-button appearance="text" size="small" (click)="onDeleteMenu(menu)">
              <span class="material-symbols-outlined">delete</span>
            </wa-button>
          </div>
        </div>
      </div>
    </ng-container>

  </div>

  <!-- ── DIALOG CRÉATION / ÉDITION ────────────────────────────────────────── -->
  <div class="adm-dialog-overlay" *ngIf="showDlg" (click)="closeDlg()">
    <div class="adm-dialog" (click)="$event.stopPropagation()">

      <div class="adm-dialog-header">
        <span>{{dlgItem?._id ? 'Modifier' : 'Créer'}} un menu</span>
        <wa-button appearance="text" size="small" (click)="closeDlg()">
          <span class="material-symbols-outlined">close</span>
        </wa-button>
      </div>

      <form *ngIf="dlgItem" style="display:flex;flex-direction:column;gap:var(--adm-space-3)" (ngSubmit)="onSaveMenu()" #dlgForm="ngForm">

        <div style="display:flex;gap:var(--adm-space-3)">
          <wa-input ngDefaultControl size="small" label="Groupe" style="flex:2"
                    [(ngModel)]="dlgItem.group" name="dlg-group"></wa-input>
          <wa-input ngDefaultControl size="small" label="Poids" type="number" style="flex:1"
                    [(ngModel)]="dlgItem.weight" name="dlg-weight"></wa-input>
        </div>

        <wa-input ngDefaultControl size="small" label="Nom ({{$i18n.locale}})"
                  [(ngModel)]="dlgItem.name[$i18n.locale]" name="dlg-name"></wa-input>

        <wa-input ngDefaultControl size="small" label="URL"
                  [(ngModel)]="dlgItem.url" name="dlg-url"></wa-input>

        <div style="display:flex;gap:var(--adm-space-4);align-items:center">
          <span style="font-size:var(--adm-font-size-s);color:var(--adm-text-secondary)">Actif</span>
          <wa-checkbox ngDefaultControl size="small"
                       [(ngModel)]="dlgItem.active" name="dlg-active"></wa-checkbox>
        </div>

      </form>

      <div class="adm-action-row">
        <wa-button appearance="outlined" size="small" (click)="closeDlg()">Annuler</wa-button>
        <wa-button appearance="filled" size="small" (click)="onSaveMenu()">Enregistrer</wa-button>
      </div>

    </div>
  </div>

</div>
