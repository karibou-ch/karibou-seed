<div class="kng-page-saving" [hidden]="isReady"><p>{{ labels.saving }}</p></div>

<div class="kng-admin-page">
  <header class="kng-page-head">
    <div class="kng-page-head__row">
      <div>
        <p class="kng-page-head__crumb">{{ labels.crumb_admin }} · {{ labels.nav_content }}</p>
        <h1>{{ labels.nav_title }}</h1>
      </div>
      <wa-button appearance="outlined" variant="neutral" size="small" (click)="onMenuCreate()">
        <span class="material-symbols-outlined" slot="start" aria-hidden="true">add</span>
        {{ labels.new_menu }}
      </wa-button>
    </div>
  </header>

  <div class="kng-callouts" *ngIf="saveMessage || saveError">
    <wa-callout *ngIf="saveMessage" variant="success" closable (wa-hide)="saveMessage=''">{{ saveMessage }}</wa-callout>
    <wa-callout *ngIf="saveError" variant="danger" closable (wa-hide)="saveError=''">{{ saveError }}</wa-callout>
  </div>

  <section class="kng-settings-group" *ngFor="let group of groups">
    <h2 class="kng-settings-group__title">{{ group }}</h2>
    <div class="kng-settings-group__box">
      <div class="kng-list-item nav-menu-item" *ngFor="let menu of getMenuByGroup(group); trackBy: trackMenu" [class.is-off]="!menu.active">
        <span class="kng-status-dot" [class.is-on]="menu.active"></span>
        <span class="nav-menu-weight">{{ menu.weight }}</span>
        <button type="button" class="kng-list-item" [attr.aria-label]="labels.open_menu" (click)="onMenuSelect($event, menu)">
          <span class="nav-menu-name">{{ menu.name?.[locale] || menu.name?.fr }}</span>
          <span class="nav-menu-url">{{ menu.url }}</span>
        </button>
        <wa-button appearance="plain" size="small" [label]="labels.edit" (click)="onMenuSelect($event, menu)">
          <span class="material-symbols-outlined" slot="start" aria-hidden="true">edit</span>
        </wa-button>
        <wa-button appearance="plain" variant="danger" size="small" [label]="labels.delete" (click)="onDeleteMenu(menu)">
          <span class="material-symbols-outlined" slot="start" aria-hidden="true">delete</span>
        </wa-button>
      </div>
    </div>
  </section>

  <wa-dialog class="kng-register-config" [label]="labels.nav_title" [open]="showDlg" (wa-hide)="closeDlg()" light-dismiss>
    <form *ngIf="dlgItem" class="kng-form" (ngSubmit)="onSaveMenu()">
      <div class="kng-form-row">
        <wa-input class="is-grow" ngDefaultControl size="small" [label]="labels.group" name="dlg-group" [(ngModel)]="dlgItem.group"></wa-input>
        <wa-input ngDefaultControl size="small" [label]="labels.weight" type="number" name="dlg-weight" [(ngModel)]="dlgItem.weight"></wa-input>
      </div>
      <kng-config-input format="text" [label]="labels.name" [i18nField]="dlgItem.name"></kng-config-input>
      <wa-input ngDefaultControl size="small" [label]="labels.menu_url" name="dlg-url" [(ngModel)]="dlgItem.url"></wa-input>
      <wa-switch size="small" [checked]="dlgItem.active" [attr.aria-label]="labels.active"
                 (change)="dlgItem.active = $any($event.target).checked">{{ labels.active }}</wa-switch>
    </form>
    <div slot="footer" class="kng-dialog-footer">
      <wa-button appearance="plain" size="small" (click)="closeDlg()">{{ labels.cancel }}</wa-button>
      <wa-button variant="brand" size="small" (click)="onSaveMenu()">{{ labels.save }}</wa-button>
    </div>
  </wa-dialog>
</div>
