<div class="kng-page-saving" [hidden]="isReady"><p>{{ labels.saving }}</p></div>

<div class="kng-admin-page">
  <header class="kng-page-head">
    <p class="kng-page-head__crumb">{{ labels.crumb_admin }} · {{ labels.nav_content }}</p>
    <h1>{{ labels.welcome_title }}</h1>
  </header>
  <kng-lang-toggle [banner]="true" [fields]="editFields"></kng-lang-toggle>
  <div class="kng-callouts" *ngIf="saveMessage || saveError">
    <wa-callout *ngIf="saveMessage" variant="success" closable (wa-hide)="saveMessage=''">{{ saveMessage }}</wa-callout>
    <wa-callout *ngIf="saveError" variant="danger" closable (wa-hide)="saveError=''">{{ saveError }}</wa-callout>
  </div>

  <section class="kng-settings-group">
    <div class="kng-settings-group__head"><h2 class="kng-settings-group__title">{{ labels.welcome_message }}</h2></div>
    <div class="kng-settings-group__box">
      <kng-config-input format="area" [label]="labels.welcome_message" [withCheck]="true"
                        [i18nField]="config?.shared.welcome.message" [checked]="config?.shared.welcome.active"
                        (checkChange)="config.shared.welcome.active = $event"></kng-config-input>
    </div>
  </section>

  <section class="kng-settings-group" *ngIf="config?.shared?.tagLine">
    <div class="kng-settings-group__head">
      <h2 class="kng-settings-group__title">{{ labels.tagline_title }}</h2>
      <kng-lang-toggle [fields]="[config?.shared?.tagLine?.t, config?.shared?.tagLine?.h, config?.shared?.tagLine?.p]"></kng-lang-toggle>
    </div>
    <div class="kng-settings-group__box">
      <kng-config-input format="text" [label]="labels.field_title" [i18nField]="config.shared.tagLine.t"></kng-config-input>
      <kng-config-input format="text" [label]="labels.field_header" [i18nField]="config.shared.tagLine.h"></kng-config-input>
      <kng-config-input format="area" [label]="labels.field_paragraph" [i18nField]="config.shared.tagLine.p"></kng-config-input>
      <kng-config-input format="image" [label]="labels.image" [config]="config" (imageChange)="onDialogOpen($event)"
                        [(ngModel)]="config.shared.tagLine.image"></kng-config-input>
    </div>
  </section>

  <section class="kng-settings-group" *ngIf="config?.shared?.about">
    <div class="kng-settings-group__head"><h2 class="kng-settings-group__title">{{ labels.about_title }}</h2></div>
    <div class="kng-settings-group__box">
      <kng-config-input format="text" [label]="labels.field_title" [i18nField]="config.shared.about.t"></kng-config-input>
      <kng-config-input format="text" [label]="labels.field_header" [i18nField]="config.shared.about.h"></kng-config-input>
      <kng-config-input format="area" [label]="labels.field_paragraph" [i18nField]="config.shared.about.p"></kng-config-input>
      <kng-config-input format="image" [label]="labels.image" [config]="config" (imageChange)="onDialogOpen($event)"
                        [(ngModel)]="config.shared.about.image"></kng-config-input>
    </div>
  </section>

  <section class="kng-settings-group" *ngIf="config?.shared?.footer">
    <div class="kng-settings-group__head"><h2 class="kng-settings-group__title">{{ labels.main_footer }}</h2></div>
    <div class="kng-settings-group__box">
      <kng-config-input format="text" [label]="labels.field_title" [i18nField]="config.shared.footer.t"></kng-config-input>
      <kng-config-input format="text" [label]="labels.field_header" [i18nField]="config.shared.footer.h"></kng-config-input>
      <kng-config-input format="area" [label]="labels.field_paragraph" [i18nField]="config.shared.footer.p"></kng-config-input>
    </div>
  </section>

  <kng-save-bar [dirty]="configDirty" [count]="configDirtyCount" [loading]="isLoading"
                (cancel)="revertConfig()" (save)="onConfigSave()"></kng-save-bar>
</div>
