<!-- ============================================================================ -->
<!-- KngRootComponent - Page d'accueil/paramètres utilisateur                   -->
<!-- Ce composant est maintenant un enfant de KngNavbarWrapperComponent         -->
<!-- ============================================================================ -->

<!-- ============================================================================ -->
<!-- PANEL SIDE - Vide                                                           -->
<!-- ============================================================================ -->
<div class="swipe-panel side">
  <div class="root-menu-panel">
    <!-- Espace disponible pour menu latéral -->
  </div>
</div>

<!-- ============================================================================ -->
<!-- PANEL CENTER - Contenu principal (paramètres utilisateur)                   -->
<!-- ============================================================================ -->
<div class="swipe-panel center">

    <div class="root-container">

      <!-- I18N Toggle -->
      <div class="kng-card kng-card--soft i18n-toggle">
        <kng-slider [small]="true" (change)="doLocaleSwitch()">
          {{label.nav_i18n}}&nbsp;({{locale}})
        </kng-slider>
      </div>

      <!-- LOGIN (non authentifié) -->
      <a class="kng-action-link" [hidden]="user.isAuthenticated()" [routerLink]="'/store/'+store+'/home/me/login'">
        <span class="label" [innerHtml]="llabel.title_account_sign"></span>
        <span class="material-symbols-outlined chevron">chevron_right</span>
      </a>

      <kng-mail-confirmation [user]="user" *ngIf="user.isAuthenticated()&&!user.isReady()"></kng-mail-confirmation>

      <kng-wallet [user]="user" *ngIf="user.isAuthenticated()"></kng-wallet>

      <!-- ACTIONS GROUPE - Utilisateur authentifié -->
      <div class="kng-action-group">
        <!-- Commandes -->
        <a class="kng-action-link" [class.disabled]="!user.isAuthenticated()" [routerLink]="'/store/'+store+'/home/me/orders'">
          <span class="label" [innerHtml]="llabel.title_orders"></span>
          <span class="material-symbols-outlined chevron">chevron_right</span>
        </a>

        <!-- Factures -->
        <a class="kng-action-link" [class.disabled]="!user.isAuthenticated()" [routerLink]="'/store/'+store+'/home/me/invoices'">
          <span class="label" [innerHtml]="llabel.title_invoices_open"></span>
          <span class="material-symbols-outlined chevron">chevron_right</span>
        </a>

        <!-- Email -->
        <a class="kng-action-link" [class.disabled]="!user.isAuthenticated()" [routerLink]="'/store/'+store+'/home/me/email'">
          <span class="label" [innerHtml]="llabel.title_account_mail"></span>
          <span class="material-symbols-outlined chevron">chevron_right</span>
        </a>

        <!-- Adresse de livraison -->
        <a class="kng-action-link" [class.disabled]="!user.isAuthenticated()" [routerLink]="'/store/'+store+'/home/me/email'">
          <span class="label" [innerHtml]="llabel.title_account_shipping"></span>
          <span class="material-symbols-outlined chevron">chevron_right</span>
        </a>

        <!-- Abonnements -->
        <a class="kng-action-link" [class.disabled]="!user.isAuthenticated()" [routerLink]="'/store/'+store+'/home/me/subscriptions'">
          <span class="label" [innerHtml]="llabel.title_account_subscriptions"></span>
          <span class="material-symbols-outlined chevron">chevron_right</span>
        </a>
      </div>

    </div>

    <!-- FEEDBACK -->
    <kng-feedback [config]="config" [user]="user" [hidden]="!user.isAuthenticated()">
    </kng-feedback>

</div>

<!-- ============================================================================ -->
<!-- PANEL RIGHT - Vide                                                          -->
<!-- ============================================================================ -->
<div class="swipe-panel right">
  <div class="root-sidebar-panel">
    <!-- MARKETPLACE -->
    <kng-nav-marketplace (updated)="doOpenMarket($event)" [hidden]="lockedHUB" [config]="config"
      [orders]="orders"></kng-nav-marketplace>

    <!-- Espace disponible pour sidebar -->
  </div>
</div>
