<ng-container [ngSwitch]="normalizedTemplate">
  <kng-product-view-detailled
    *ngSwitchCase="productTemplates.Detailled"
    [productCtrl]="productCtrl">
  </kng-product-view-detailled>

  <article
    *ngSwitchCase="productTemplates.Thumbnail"
    kng-product-view-thumbnail
    [productCtrl]="productCtrl">
  </article>

  <article
    *ngSwitchCase="productTemplates.Card"
    kng-product-view-card
    [productCtrl]="productCtrl">
  </article>

  <div
    *ngSwitchCase="productTemplates.Tiny"
    kng-product-view-tiny
    [productCtrl]="productCtrl">
  </div>
</ng-container>
