  <!-- CONTAINER-->
  <div class="calendar-container">
    <h3 [hidden]="minimal">{{mainTitle}}</h3>

    <!-- NO SHIPPING -->
    <div class="noshipping block-warning" [hidden]="!noshippingMsg">
      <i class="material-symbols-outlined ">info</i>
      <span>{{noshippingMsg}}</span>
    </div>

    <!-- CALENDAR -->
    <div class="calendar kng-card kng-card--soft ">
      <div class="list">
          <div class="element"
          [class.selected]="day.equalsDate(currentShippingDay)"
          [class.disabled]="!isDayAvailable(day)"
          *ngFor="let day of currentWeek;let idx=index"
          (click)="doSetCurrentShippingDay($event,day,idx)">
            <!-- FIXME: day can be undefined -->
            <div class="ei_Title">{{day|date:'EEE d':'':locale}}</div>
        </div>
      </div>
    </div>

    <!-- LAST MINUTE -->
    <div class="last-minute kng-card kng-card--soft"
         *ngIf="lastMinuteOption"
         [hidden]="minimal">
      <kng-slider [small]="true" [checked]="isLastMinuteSelected" (change)="selectLastMinute()">
        <span class="icon">🗲</span>
        <span [innerHtml]="i18n.lastMinuteLabel"></span>
        <span class="time">{{ lastMinuteTime }}h</span>
      </kng-slider>
    </div>



    <!-- SWITCH HUB -->
    <div class="switch-hub kng-card kng-card--white " [hidden]="minimal">
      <div class="label">{{label_switch_store}}</div>
      <button [routerLink]="['/store',displayHubSwitch.slug,'home']">{{displayHubSwitch.name}}</button>
    </div>

    <!-- PENDING ORDER -->
    <div [hidden]="!pendingOrder" >
        <p [innerHtml]="label.cart_order_grouped_info" class="help-info" ></p>
    </div>



  </div>
