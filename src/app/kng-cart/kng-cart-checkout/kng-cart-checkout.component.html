<!-- NAVIGATION  -->
<div class="kng-checkout-drawer" [class.kng-drawer-open]="open">

  <header class="checkout-header">
    <button type="button" class="checkout-back" (click)="closeCheckout()" [attr.aria-label]="label.checkout_back">
      <span class="material-symbols-outlined size-large">arrow_back</span>
    </button>
    <h2>{{label.checkout_summary_title}}</h2>
  </header>

  <!-- CHECKOUT-->
  <div class="checkout" *ngIf="isReady">
    <div class="cart-container checkout-details">
      <kng-checkout-review
        [address]="currentAddress"
        [addresses]="userAddresses"
        [depositAddresses]="useCartSubscriptionView ? [] : getDepositAddress()"
        [payment]="currentPayment"
        [payments]="userPayments"
        [shippingDay]="reviewShippingDay"
        [shippingTime]="reviewShippingTime"
        [(shippingNote)]="shippingNote"
        [isLastMinuteShipping]="reviewIsLastMinuteShipping"
        [isAddressEditing]="!selectAddressIsDone"
        [isAddressDeposit]="isCartDeposit()"
        [isPaymentEditing]="!selectPaymentIsDone"
        [computeShippingAmount]="shippingFeeForAddress"
        (editAddress)="editAddressFromReview()"
        (addressSelected)="setShippingAddress($event)"
        (addAddressRequested)="addAddressFromReview()"
        (editPayment)="editPaymentFromReview()"
        (paymentSelected)="setPaymentMethod($event)"
        (addPaymentRequested)="addPaymentFromReview()">
      </kng-checkout-review>

      <div class="checkout-reservation-info">
        <div class="reservation-title">
          <span>{{label.checkout_reserved_title}}</span>
          <button type="button" class="reservation-toggle" (click)="showReservationInfo = !showReservationInfo">
            <span class="material-symbols-outlined">info</span>
          </button>
        </div>
        <div class="reservation-copy" [hidden]="!showReservationInfo">
          {{ label.cart_amount_1 }}
          {{ label.cart_amount_2 }}
        </div>
      </div>


      <!-- SUBSCRIPTION OPTIONS -->
      <div class="subscription" [hidden]="!useCartSubscriptionView || hasPendingSubscription">
        <kng-subscription-option [checkout]="true" [quiet]="true" [contract]="hasUpdateContract" [hub]="hub" *ngIf="useCartSubscriptionView"></kng-subscription-option>
      </div>

      <div class="subscription" *ngIf="hasPendingSubscription">
          <!-- DO SUBSCRIPTION -->
          <div [hidden]="!useCartSubscriptionView">
            <button class="button" (click)="doSubscription()" >{{label.cart_update_subscription_payment}}</button>
          </div>

          <div class="bill error" [hidden]="!errorMessage">
            {{errorMessage}}
          </div>
      </div>

    </div>
    <div class="cart-container checkout-summary">
      <!-- RESUME -->
      <!-- RESUME subscription or simple order -->
      <div class="order-resume" *ngIf="isOpen && !hasPendingSubscription">
        <kng-cart-invoice
          [type]="useCartSubscriptionView ? 'subscription' : 'cart'"
          [user]="user"
          [data]="{
            items: items,
            address: currentAddress,
            payment: currentPayment,
            contract: contract,
            updateItems: updateItems,
            subscriptionParams: subscriptionParams
          }"
          [config]="config"
          [hub]="hub">
        </kng-cart-invoice>


      <!-- COUPON -->
      <kng-checkout-coupon
        [hidden]="useCartSubscriptionView || !user.isAuthenticated()||!user.isReady()||!isOpen()"
        [(couponCode)]="couponCode"
        [couponCredit]="couponCredit"
        [couponError]="couponError"
        [isRunning]="isCouponRunning"
        (couponChanged)="onCouponChange()"
        (applyCoupon)="readCoupon()">
      </kng-checkout-coupon>

        <!-- BLOCK DE RIGHT -->
        <kng-checkout-confirmation
          [(billNote)]="billNote"
          [(cgAccepted)]="cgAccepted"
          [store]="store"
          [user]="user"
          [useCartSubscriptionView]="useCartSubscriptionView"
          [isFinalizeDisabled]="isFinalizeDisabled"
          [isRunning]="isRunning"
          [errorMessage]="errorMessage"
          (orderRequested)="doOrderRouting()"
          (subscriptionRequested)="doSubscription()">
        </kng-checkout-confirmation>

        <div class="checkout-support-card">
          <a class="phone" href="tel:{{hub.address.phone}}">
            <i class="material-symbols-outlined icon">phone</i>&nbsp;{{label.cart_info_help}} {{hub.address.phone}}
          </a>
        </div>

        <!-- CHECKOUT  MSG -->
        <div class="checkout-msg" *ngIf="config.shared.hub.checkout.active">
          <div [innerHtml]="config.shared.hub.checkout.message[locale]"></div>
        </div>

      </div>

    </div>
  </div>
</div>
