<div class="customer" *ngIf="!boxed">
  <div class="kng-boxed bill with-border" [hidden]="!hasInvoiceTransfer || hasInvoice" [class.boxed]="boxed">
    <div class="label">{{llabel.title_invoice_paid}}</div>
    <div class="content">
      <p>{{qrbillTransfer || 'Aucune facture en attente'}}</p>
      <div class="bottom">
        <wa-button appearance="filled-outlined" variant="neutral" size="small" pill [routerLink]="'/store/' + store + '/home/me/invoices'">{{llabel.title_invoice_open}}</wa-button>
      </div>
    </div>
  </div>
</div>

<kng-feedback-last-delivered-card
  *ngIf="feedbackOrder"
  [order]="feedbackOrder"
  [orderState]="getOrderState(feedbackOrder)"
  [boxed]="boxed"
  [locale]="locale"
  [texts]="llabel"
  [isSubmittingQuick]="isSubmittingQuick"
  [expanded]="expandedFeedbackOrderOid === feedbackOrder.oid"
  [childOrders]="getChildOrders(feedbackOrder)"
  (openIssue)="openIssue($event)"
  (quickSubmit)="onQuickEvaluate(feedbackOrder, $event)"
  (reportIssue)="openIssue(feedbackOrder, $event)"
  (openOrder)="openOrder($event)"
  (toggleDetails)="toggleDetails($event)"
  (addAllToCart)="onAddAllToCart($event)"
  (cancelOrder)="onCancelOrder($event)">
</kng-feedback-last-delivered-card>

<kng-feedback-current-order-card
  *ngIf="currentOrder"
  [order]="currentOrder"
  [orderState]="getOrderState(currentOrder)"
  [boxed]="boxed"
  [locale]="locale"
  [texts]="llabel"
  (openOrder)="openOrder($event)"
  (cancelOrder)="onCancelOrder($event)">
</kng-feedback-current-order-card>

<kng-feedback-issue-modal
  *ngIf="issueOrder"
  [order]="issueOrder"
  [childOrders]="getChildOrders(issueOrder)"
  [feedbackText]="feedbackText"
  [analysisText]="analysisText"
  [isAnalyzing]="isAnalyzing"
  [isAnalysisReady]="isAnalysisReady"
  [texts]="llabel"
  [locale]="locale"
  [audioKey]="config?.shared?.keys?.pubUpcare"
  (close)="onBack()"
  (feedbackTextChange)="setFeedbackText($event)"
  (analyzeIssue)="analyzeIssue()"
  (submitIssue)="onEvaluate()">
</kng-feedback-issue-modal>

<kng-feedback-order-modal
  *ngIf="selectedOrderPopup"
  [order]="selectedOrderPopup"
  [childOrders]="getChildOrders(selectedOrderPopup)"
  [texts]="llabel"
  [locale]="locale"
  (close)="onBack()"
  (addAllToCart)="onAddAllToCart($event)">
</kng-feedback-order-modal>
